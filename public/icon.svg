<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    
    <!-- Neon Cyber Cyan Glow -->
    <filter id="neonGlowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Neon Emerald Glow -->
    <filter id="neonGlowEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Court Border (Subtle Indigo) -->
  <rect x="64" y="64" width="384" height="384" rx="24" fill="none" stroke="#312e81" stroke-width="6" opacity="0.6" />
  
  <!-- Net Center Line -->
  <line x1="256" y1="64" x2="256" y2="448" stroke="#4f46e5" stroke-width="4" stroke-dasharray="8 6" opacity="0.5" />

  <!-- Glowing Shuttlecock Icon Group -->
  <g transform="translate(256, 256)">
    <!-- Shuttlecock Feathers -->
    <path d="M-60,-80 L-10,60 L10,60 L60,-80 Z" fill="none" stroke="#06b6d4" stroke-width="12" stroke-linejoin="round" filter="url(#neonGlowCyan)" />
    <path d="M-30,-80 L-5,60 M30,-80 L5,60" fill="none" stroke="#06b6d4" stroke-width="8" opacity="0.8" filter="url(#neonGlowCyan)" />
    
    <!-- Feather Ribs / Bands -->
    <path d="M-45,-30 L45,-30" fill="none" stroke="#06b6d4" stroke-width="8" filter="url(#neonGlowCyan)" />
    <path d="M-30,20 L30,20" fill="none" stroke="#06b6d4" stroke-width="8" filter="url(#neonGlowCyan)" />

    <!-- Shuttlecock Cork (Base) -->
    <path d="M-20,60 C-20,90 20,90 20,60 Z" fill="#10b981" filter="url(#neonGlowEmerald)" />
  </g>
</svg>
